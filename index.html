<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ChatZone</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="splash" id="splash">
        <div class="ripple-field">
            <span class="ripple r1"></span>
            <span class="ripple r2"></span>
            <span class="ripple r3"></span>
        </div>

        <div class="splash-content">
            <div class="logo-wrap">
                <img src="chatzone.png" alt="ChatZone" class="logo-img">
            </div>
            <h1 class="brand-name">ChatZone</h1>
            <p class="brand-tag">تواصل من غير حدود</p>
        </div>

        <div class="splash-footer">
            <div class="load-track">
                <div class="load-bar" id="loadBar"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
