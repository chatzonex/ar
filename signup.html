<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ChatZone — تسجيل الدخول</title>
<link rel="stylesheet" href="auth.css">
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
</head>
<body>

    <div class="auth-screen">
        <div class="auth-top">
            <div class="mini-logo">
                <img src="chatzone.png" alt="ChatZone">
            </div>
        </div>

        <div class="auth-card">
            <h1 class="auth-title">إيه إيميلك؟</h1>
            <p class="auth-sub">هنبعتلك كود تأكيد مكوّن من 6 أرقام عشان نتأكد إنه إنت</p>

            <div class="field-group">
                <label for="emailInput">البريد الإلكتروني</label>
                <input type="email" id="emailInput" placeholder="example@mail.com" autocomplete="email" inputmode="email">
                <span class="field-error" id="emailError"></span>
            </div>

            <button class="primary-btn" id="sendCodeBtn">
                <span class="btn-label">إرسال الكود</span>
                <span class="btn-spinner" id="btnSpinner"></span>
            </button>
        </div>

        <p class="auth-footnote">بالمتابعة، إنت موافق على شروط استخدام ChatZone</p>
    </div>

    <script src="signup.js"></script>
</body>
</html>
