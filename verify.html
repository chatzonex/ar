<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ChatZone — تأكيد الكود</title>
<link rel="stylesheet" href="auth.css">
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
</head>
<body>

    <div class="auth-screen">
        <button class="theme-toggle-btn" id="authThemeToggle" aria-label="تبديل الوضع الداكن/الفاتح">
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        </button>
        <div class="auth-top">
            <div class="mini-logo">
                <img src="chatzone.png" alt="ChatZone">
            </div>
        </div>

        <div class="auth-card">
            <h1 class="auth-title">أدخل الكود</h1>
            <p class="auth-sub">بعتنالك كود تأكيد مكوّن من 6 أرقام على <b id="targetEmail">إيميلك</b></p>

            <div class="otp-row" id="otpRow">
                <input type="text" class="otp-box" inputmode="numeric" maxlength="1" data-index="0">
                <input type="text" class="otp-box" inputmode="numeric" maxlength="1" data-index="1">
                <input type="text" class="otp-box" inputmode="numeric" maxlength="1" data-index="2">
                <input type="text" class="otp-box" inputmode="numeric" maxlength="1" data-index="3">
                <input type="text" class="otp-box" inputmode="numeric" maxlength="1" data-index="4">
                <input type="text" class="otp-box" inputmode="numeric" maxlength="1" data-index="5">
            </div>

            <div class="verify-status" id="verifyStatus"></div>

            <div class="resend-row">
                مستني الكود؟
                <span class="resend-link" id="resendLink">إعادة الإرسال</span>
                <span id="resendTimer"></span>
            </div>

            <a href="signup.html" class="change-email-link">مش الإيميل ده؟ غيّره</a>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="auth-theme.js"></script>
    <script type="module" src="verify.js"></script>
</body>
</html>
